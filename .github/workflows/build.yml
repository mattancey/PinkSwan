name: Build Pink Swan (macOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    name: Build & Test on macOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build Pink Swan & Tests
        run: cmake --build build --config Release --parallel 4

      - name: Run DSP Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Ad-hoc Sign Plugin Bundles
        run: |
          codesign --force --deep --sign - "build/PinkSwan_artefacts/Release/VST3/Pink Swan.vst3"
          codesign --force --deep --sign - "build/PinkSwan_artefacts/Release/AU/Pink Swan.component"

      - name: Upload Artifacts (AU & VST3)
        uses: actions/upload-artifact@v5
        with:
          name: Pink-Swan-macOS
          path: |
            build/PinkSwan_artefacts/Release/VST3/Pink Swan.vst3
            build/PinkSwan_artefacts/Release/AU/Pink Swan.component
          if-no-files-found: error
